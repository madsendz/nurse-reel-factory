# Nurse Reel Factory — main settings. Edit this file to change how the bot behaves.

paused: false            # true = never post
# Approve each reel in Telegram before it posts (the evening before). Unapproved reels never post.
approvals:
  relay_url: "https://lexi-reels-relay.mrsendzik.workers.dev"
  enabled: true
  telegram_chat_id: ""   # filled in automatically after you press Start in your bot
timezone: America/New_York

# Times to post each day (Eastern). type: regular (followers + feed) or trial
# (shown to non-followers first). The GitHub schedule checks these.
post_times:
  - { time: "09:30", type: regular }
  - { time: "11:00", type: trial }
  - { time: "13:00", type: regular }
  - { time: "16:00", type: trial }
  - { time: "19:30", type: regular }
  - { time: "21:30", type: trial }

# Trial reels: MANUAL = stays trial-only until you tap "share to followers" in the IG app.
#              SS_PERFORMANCE = Instagram shares it automatically if it does well.
trial:
  graduation_strategy: MANUAL

# --- Where clips come from ---
drive:
  folder_id: "1V6x7eBL4Mg1_PslRObLvgNPxQKdeywgy"   # the "NurseReels" folder

# --- Instagram (Facebook Login for Business / Graph API) ---
instagram:
  api_version: v25.0
  ig_user_id: ""         # set during setup (also can come from IG_USER_ID secret)
  share_to_feed: true

# --- Link click tracking (Cloudflare Web Analytics) ---
clicks:
  host: nurselexi.com
  path_prefix: /n        # the nurse page tracking link
  attribution_window_hours: 48
  decay_half_life_hours: 12

# --- How reels are scored (link clicks first) ---
scoring:
  weights:               # each metric is standardized, then weighted
    clicks: 0.60
    views: 0.20
    shares: 0.10
    saved: 0.10
  recency_half_life_days: 30   # newer results count more ("recent trends")
  min_age_hours: 48            # don't judge a reel until it's this old

# --- How the next reel is chosen ---
picker:
  explore_rate: 0.25           # regular reels: share that test new / unproven topics
  trial_explore_rate: 0.60     # trial reels are for testing, so they try new topics more
  topic_cooldown_days: 7       # Nick: never repeat a topic within 7 days
  daily_mix: {winner: 3, new: 3}   # Nick: every day half proven winners, half brand-new topics (any slot)
  clip_cooldown_posts: 4       # don't reuse a clip within the last N posts
  max_same_category_in_row: 2

# --- Reel look ---
render:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 30
  min_seconds: 6
  seconds_per_beat: 2.6        # how long each text line stays before the next appears
  audio: keep                  # keep | mute
  font: assets/fonts/Poppins-Bold.ttf
  text_color: "#111111"
  box_color: "#FFFFFF"
  box_opacity: 0.94
  # Title (hook): matches the @lexixoofficial look — white serif, black outline + block offset
  hook_font: assets/fonts/InstrumentSerif-Regular.ttf   # free lookalike for Advercase
  hook_size: 118               # max size; shrinks to fit (max 4 lines)
  hook_color: "#FFFFFF"
  hook_outline_color: "#000000"
  hook_outline: 0.075          # outline thickness (fraction of font size)
  hook_offset: [0.05, 0.07]    # block-offset shadow (x, y) as fraction of font size
  hook_center_y: 0.50          # title centered here (moves below the face if it would cover it)
  hook_width: 0.86
  hook_case: lower_keep_caps   # "is a curve NORMAL?" style; use "natural" to keep as written
  hook_emoji: ""               # emojis are written into each title in content/bank.yaml
  # Facts (subtitles): white boxes that pop up where Lexi points
  sub_size: 50
  sub_top_min: 0.16            # facts never start higher than this
  safe_bottom: 0.78            # keep text above IG's caption/buttons area
  # Optional: soften words in ON-SCREEN text only (not captions) to avoid reach limits.
  soften_words: false
  soften_map:
    sex: "s3x"
    penis: "p3nis"
    vagina: "vag1na"
    orgasm: "0rgasm"
    porn: "p0rn"

# --- Sound: trending audio from Instagram's music library (picked fresh for each reel) ---
sound:
  enabled: true
  # baked = a royalty-free track (CC0 / CC BY, ok for business use) is mixed into the video.
  # Instagram's API ignored library sounds for this account, so "attach" mode does nothing.
  mode: baked                  # baked | attach
  genres: ["lofi hip hop", "phonk", "chill rnb", "deep house", "trap beat", "afrobeat", "chillhop"]  # popular reel styles
  licenses: "cc0,by"           # CC BY tracks get a short credit line in the caption
  top_n: 8                     # pick among the top results for a genre
  music_volume: 0.9
  music_start: 25              # start this many seconds into the track (skips slow intros)
  # used by attach mode only:
  type: original_sound
  search: ""
  avoid_last: 6

# --- Caption ---
caption:
  ctas:
    - "More nurse-approved facts at the link in my bio 🩺"
    - "The full lesson is in my bio 💉"
    - "Nurse Lexi's private notes → link in bio"
  base_hashtags: ["#nurselexi", "#sexualhealth", "#nursetok", "#healthfacts"]
  category_hashtags:
    mens_health: ["#menshealth", "#mensfacts"]
    sexual_wellness: ["#sexualwellness", "#selfcare"]
    sex_ed: ["#sexed", "#sexeducation"]
    anatomy: ["#anatomy", "#medicalfacts"]
  max_hashtags: 6

# --- Optional: Claude writes new topic ideas based on your winners ---
ideas:
  enabled: false               # needs ANTHROPIC_API_KEY secret
  model: claude-sonnet-4-5
  per_run: 8                   # new ideas land as status: review — they never post until you approve
