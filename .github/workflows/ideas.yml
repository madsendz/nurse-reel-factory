name: Write new topics
# Started by the ✨ button on the dashboard's Topics tab. Claude writes a few new topic ideas into
# content/bank.yaml as status: review — they show up on the Topics tab for you to keep or toss.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "How many topics"
        default: "3"

permissions:
  contents: write

concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m reelfactory ideas --force --n "${{ github.event.inputs.n || '3' }}"
      - name: Save state
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add content data || true
          git diff --cached --quiet && exit 0
          git commit -m "bot: new topic ideas"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
