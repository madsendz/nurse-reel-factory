name: Make the next days' reels (Telegram approval)
# Every evening: renders the reels for the next few days (config.yaml queue.days_ahead) and sends them to Telegram.
# Only reels you approve there get posted.
on:
  schedule:
    - cron: "15 23 * * *"   # ~7:15 PM Eastern (6:15 PM in winter)
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "N = fill the next N days, 0 = the rest of today (empty = config.yaml queue.days_ahead)"
        default: ""
      extra:
        description: 'Extra test reels today, e.g. regular@21:30,trial@22:30 (leave empty for normal)'
        default: ""

permissions:
  contents: write

concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  queue:
    runs-on: macos-latest  # macOS = Apple Color Emoji in the reels
    timeout-minutes: 45
    env:
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && (command -v ffmpeg || brew install -q ffmpeg)
      - run: python -m reelfactory queue --days-ahead "${{ inputs.days_ahead }}" --extra "${{ inputs.extra }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet && exit 0
          git commit -m "bot: queued reels for approval"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
