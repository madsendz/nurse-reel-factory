name: Past reels report
# Looks back at past reels (views, shares, saves, estimated link clicks) and grabs frames from the top ones.
on:
  workflow_dispatch:
    inputs:
      days: { description: "How many days back", default: "730" }

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m reelfactory.history --days ${{ inputs.days }} --max 2000
      - name: Save the list to reports/ (so old winners can be read back into the topic bank)
        run: |
          mkdir -p reports && cp out/history/history.csv reports/history.csv
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add reports/history.csv
          git diff --cached --quiet && exit 0
          git commit -m "bot: past reels report $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with: { name: history, path: out/history, retention-days: 14 }
