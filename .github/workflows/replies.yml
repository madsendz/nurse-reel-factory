name: Replace reels you replied to
# Every 30 min (8 AM - midnight Eastern): reads your Telegram replies. A reply with
# notes counts as a skip; this renders a replacement for that time slot.
on:
  schedule:
    - cron: "40 0,2,13,15,17,19,21 * * *"   # backup only: the Cloudflare helper starts this right after a note/redo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Telegram check
        run: |
          python - <<'PY'
          from reelfactory.approve import _tg
          me = _tg("getMe"); w = _tg("getWebhookInfo")
          print("bot:", me.get("username"), "| webhook:", w.get("url") or "none", "| pending:", w.get("pending_update_count"), "| last error:", w.get("last_error_message"))
          PY
      - name: Read Telegram replies
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import contextlib, sys
          from reelfactory.config import load_config
          from reelfactory import approve
          cfg = load_config()
          need = False
          with contextlib.redirect_stdout(sys.stderr):  # keep logs out of GITHUB_OUTPUT
              if approve.enabled(cfg):
                  approve.sync_updates(cfg)
                  need = bool(approve.pending_replacements())
          print("need=" + ("true" if need else "false"))
          PY
      - if: steps.check.outputs.need == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - if: steps.check.outputs.need == 'true'
        run: python -m reelfactory replies
      - name: Save state
        if: always()
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet && exit 0
          git commit -m "bot: telegram replies"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
