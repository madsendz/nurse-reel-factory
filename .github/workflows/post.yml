name: Post reel
# Runs at each post time in config.yaml. Two UTC times per slot cover
# daylight saving (EDT/EST); the script only posts once per slot.
# Slots (ET): 08:00 T, 09:30 R, 11:00 T, 12:00 T, 13:00 R, 14:30 T, 16:00 T, 17:30 T, 19:30 R, 21:30 T -> edit if you change post_times.
on:
  schedule:
    # GitHub often delays or drops runs at :00/:30, so each slot gets a check at +3 min and a backup at +18.
    - cron: "3,18 12,13,15,16,17,18,20,21 * * *"       # :00 slots — 08:00 T, 11:00 T, 12:00 T, 13:00 R, 16:00 T ET
    - cron: "33,48 13,14,18,19,21,22,23,0,1,2 * * *"   # :30 slots — 09:30 R, 14:30 T, 17:30 T, 19:30 R, 21:30 T ET
  workflow_dispatch:
    inputs:
      force:
        description: "Post right now (ignores schedule/pause)"
        type: boolean
        default: false
      trial:
        description: "Post as a trial reel (with force)"
        type: boolean
        default: false
      dry_run:
        description: "Render only, don't publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: macos-15  # macOS = Apple Color Emoji in the reels (pinned: macos-latest became macOS 26, where the emoji font stopped opening) (the reel is rendered again here)
    timeout-minutes: 30
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Is a slot due?
        id: due
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          python - <<'PY' >> $GITHUB_OUTPUT
          from datetime import datetime, timezone
          from reelfactory.cli import _due_slot
          from reelfactory.config import load_config, load_posts
          cfg = load_config()
          due = None if cfg.get("paused") else _due_slot(cfg, load_posts(), datetime.now(timezone.utc))
          if not cfg.get("paused") and (cfg.get("approvals") or {}).get("enabled"):
              import contextlib, sys
              from reelfactory.approve import due_entries
              with contextlib.redirect_stdout(sys.stderr):  # keep logs out of GITHUB_OUTPUT
                  due = due_entries(cfg) or None   # only reels approved in Telegram (regular slots + extras)
          print("go=" + ("true" if due else "false"))
          PY
      - name: Install ffmpeg
        if: steps.due.outputs.go == 'true'
        run: command -v ffmpeg || brew install -q ffmpeg
      - name: Refresh stats
        if: steps.due.outputs.go == 'true'
        run: python -m reelfactory refresh || echo "refresh failed, continuing with saved stats"
      - name: Pick, edit, post
        if: steps.due.outputs.go == 'true'
        run: |
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.trial }}" = "true" ] && ARGS="$ARGS --trial"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run --force"
          python -m reelfactory post $ARGS
      - name: Save the rendered reel
        if: steps.due.outputs.go == 'true' && always()
        uses: actions/upload-artifact@v4
        with: { name: reel, path: out/*.mp4, if-no-files-found: ignore, retention-days: 14 }
      - name: Save state
        if: always()
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add data reports clips || true
          git diff --cached --quiet && exit 0
          git commit -m "bot: post + stats $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
