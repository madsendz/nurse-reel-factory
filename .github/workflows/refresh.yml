name: Daily stats + report
on:
  schedule:
    - cron: "15 10 * * *"   # ~6:15 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # lets this job publish the dashboard state (Topics tab)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m reelfactory refresh
      - name: New topic ideas (only if enabled in config.yaml)
        run: python -m reelfactory ideas || echo "ideas step skipped/failed"
      - name: Save state
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add data reports content || true
          git diff --cached --quiet && exit 0
          git commit -m "bot: daily stats $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
