<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi Reels</title>
<meta name="theme-color" content="#faf7f5">
<style>
:root{
  --bg:#faf7f5; --panel:#ffffff; --ink:#1d1a19; --muted:#6f6763; --line:#ebe4df; --soft:#f3eee9;
  --accent:#c2416b; --accent-ink:#fff;
  --ok:#1f8a4c; --ok-bg:#e5f5ec; --wait:#a86a00; --wait-bg:#fdf1dc; --bad:#b3261e; --bad-bg:#fbe6e4;
  --post:#3756c8; --post-bg:#e7ecfb; --gray-bg:#efecea;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141212; --panel:#1d1a19; --ink:#f2edea; --muted:#a59d98; --line:#2e2a28; --soft:#25211f;
    --accent:#e26d93; --ok:#5fd18f; --ok-bg:#183323; --wait:#f0b44d; --wait-bg:#3a2b12; --bad:#f2817a; --bad-bg:#3b1a18;
    --post:#93a8ff; --post-bg:#1d2544; --gray-bg:#2a2624; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.nav{display:inline-flex;gap:4px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.range{font-weight:600;min-width:140px;text-align:center}
.sync{font-size:12.5px;color:var(--muted)}
h2.day{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding:14px 0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-height:120px}
.col.today{border-color:var(--accent)}
.col h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
.col h3 span{color:var(--muted);font-weight:500}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:9px;padding:6px 8px;margin:5px 0;cursor:pointer;font-size:12.5px;line-height:1.3}
.chip b{display:block;font-size:12px}
.chip.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default}
/* status */
.s-pending{background:var(--wait-bg);color:var(--wait)}
.s-approved{background:var(--ok-bg);color:var(--ok)}
.s-posted{background:var(--post-bg);color:var(--post)}
.s-skipped,.s-missed,.s-expired{background:var(--gray-bg);color:var(--muted)}
.s-redo{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--muted);margin-right:4px}
.tag.trial{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
/* day */
.slot{margin:14px 0 22px}
.slot-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.slot-h .t{font-size:20px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:230px 1fr;gap:16px;padding:14px}
.card + .card{margin-top:10px}
.card.old{opacity:.6}
.vid{width:230px;aspect-ratio:9/16;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vid video{width:100%;height:100%;object-fit:cover;background:#000}
.vid.none{aspect-ratio:auto;background:var(--soft);min-height:90px}
.novid{color:var(--muted);font-size:13px;text-align:center;padding:14px}
.info{min-width:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.title{font-size:17px;font-weight:700;line-height:1.3}
.beats{margin:0;padding-left:18px}
.beats li{margin:3px 0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:15px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.notes{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px}
.notes li{background:var(--soft);border-radius:9px;padding:6px 9px;margin:5px 0}
.notes small{color:var(--muted);display:block}
textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);resize:vertical}
select,input[type=datetime-local]{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg);max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.on{opacity:1}
.login{max-width:340px;margin:18vh auto 0;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.empty-day{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:14px;color:var(--muted)}
/* clips tab */
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.clipcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.clipcard:hover{border-color:var(--accent)} .clipcard.dim{opacity:.55}
.clipcard b{font-size:15px} .tags{display:flex;flex-wrap:wrap;gap:4px} .tag.auto{background:var(--wait-bg);color:var(--wait)}
.card.ce{grid-template-columns:300px 1fr}
.cevid{width:300px;position:relative}
.cevid video{object-fit:contain}
.overlay{position:absolute;inset:0;cursor:crosshair}
.mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
.tline{position:absolute;left:0;right:0;border-top:2px dashed #fff;opacity:.85;pointer-events:none}
.tline span{position:absolute;right:4px;top:-18px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px}
.evlist{margin:0;padding:0;list-style:none} .evlist li{margin:4px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.placing{background:var(--wait-bg);color:var(--wait);border-radius:10px;padding:8px 10px;font-weight:600}
input[type=number]{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg)}
@media (max-width:720px){
  .card.ce{grid-template-columns:1fr}
  .cevid{width:100%;max-width:330px;margin:0 auto}
  .card{grid-template-columns:1fr}
  .vid{width:100%;max-width:330px;margin:0 auto}
  .week{grid-template-columns:repeat(7,minmax(118px,1fr))}
  .range{min-width:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const TZ_DEFAULT = "America/New_York";
const tz = () => (S && S.timezone) || TZ_DEFAULT;
let S = null, view = localStore("view") || "day", anchor = todayKey(), busy = false, openNotes = {};

function localStore(k, v){ try{ if(v===undefined) return localStorage.getItem("lr_"+k); localStorage.setItem("lr_"+k, v);}catch(e){ return null; } }
function parts(iso){ const d=new Date(iso); const f=new Intl.DateTimeFormat("en-CA",{timeZone:tz(),year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d); const o={}; f.forEach(p=>o[p.type]=p.value); if(o.hour==="24") o.hour="00"; return o; }
function dayKey(iso){ const o=parts(iso); return `${o.year}-${o.month}-${o.day}`; }
function hm(iso){ const o=parts(iso); return `${o.hour}:${o.minute}`; }
function todayKey(){ return dayKey(new Date().toISOString()); }
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d+n,12)); return t.toISOString().slice(0,10); }
function weekStart(key){ const [y,m,d]=key.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d,12)); const dow=(t.getUTCDay()+6)%7; return addDays(key,-dow); }
function fmtTime(t){ let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; }
function fmtDay(key,long){ const [y,m,d]=key.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString("en-US",{timeZone:"UTC",weekday:long?"long":"short",month:"short",day:"numeric"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),3200); }

const LABEL = {pending:"⏳ Waiting for you", approved:"✅ Approved", posted:"📤 Posted", skipped:"❌ Skipped", missed:"⏭ Not posted", expired:"⌛ Not approved in time"};
const REDO = {swap_music:"new music", new_clip:"same topic, new clip", new_topic:"same clip, new topic", text_edit:"your text edit"};
const ED = {}; // open text editors: entry id -> {hook, beats} (kept across re-renders)
function statusOf(e){ if(e.status==="skipped" && (e.needs_replacement||e.replaced_by)) return {cls:"s-redo", text: e.replaced_by ? `🔁 Replaced (${REDO[e.redo]||"your notes"})` : `🔁 New version coming (${REDO[e.redo]||"your notes"})`};
  return {cls:"s-"+(e.status||"pending"), text: LABEL[e.status]||e.status}; }
function fmtNum(n){ if(n==null) return "–"; n=Number(n); return n>=10000? (n/1000).toFixed(n>=100000?0:1)+"k" : n.toLocaleString(); }

async function api(path, opts){ const r = await fetch(path, Object.assign({credentials:"same-origin", headers:{"content-type":"application/json"}}, opts||{})); if(r.status===401){ S=null; renderLogin(); throw new Error("login"); } const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("error "+r.status)); return j; }
async function load(quiet){ try{ S = await api("/api/state"); render(); }catch(e){ if(e.message!=="login" && !quiet) toast("Couldn't load: "+e.message); } }

function renderLogin(){
  document.getElementById("app").innerHTML = `<form class="login" id="lf"><div class="brand"><span class="dot"></span>Lexi Reels</div>
  <label class="muted" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus>
  <button class="btn primary" type="submit">Log in</button><div class="hint" id="lerr"></div></form>`;
  document.getElementById("lf").onsubmit = async ev => { ev.preventDefault();
    const r = await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});
    if(r.ok){ load(); } else document.getElementById("lerr").textContent="Wrong password."; };
}

// group entries: day -> time -> [entries newest version first]
function grouped(){
  const g = {};
  for(const e of (S.entries||[])){ const d=dayKey(e.slot_iso), t=hm(e.slot_iso); ((g[d] ||= {})[t] ||= []).push(e); }
  for(const d in g) for(const t in g[d]) g[d][t].sort((a,b)=> rank(a)-rank(b) || (b.decided_at||"").localeCompare(a.decided_at||""));
  return g;
}
function rank(e){ if(e.replaced_by || e.status==="missed" || e.status==="expired") return 3; if(e.status==="skipped") return 2; return 0; }
function slotTimes(dayK, g){ const ts = new Set((S.schedule||[]).map(s=>s.time)); Object.keys(g[dayK]||{}).forEach(t=>ts.add(t)); return [...ts].sort(); }
function schedType(t){ const s=(S.schedule||[]).find(x=>x.time===t); return s? s.type : null; }

function render(){
  if(!S) return renderLogin();
  const g = grouped();
  const days = view==="week" ? [...Array(7)].map((_,i)=>addDays(weekStart(anchor),i)) : [anchor, addDays(anchor,1)];
  const rangeText = view==="clips" ? (CE? CE.id : "Clips") : view==="topics" ? "Topics" : view==="week" ? `${fmtDay(days[0])} – ${fmtDay(days[6])}` : `${fmtDay(days[0],true)}`;
  const gen = S.generated_at ? new Date(S.generated_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "–";
  let html = `<header><div class="bar"><div class="brand"><span class="dot"></span>Lexi Reels</div>
    <div class="seg"><button data-view="day" class="${view==="day"?"on":""}">Day</button><button data-view="week" class="${view==="week"?"on":""}">Week</button><button data-view="topics" class="${view==="topics"?"on":""}">Topics${(S.topics?.review||[]).length?` (${S.topics.review.length})`:""}</button><button data-view="clips" class="${view==="clips"?"on":""}">Clips</button></div>
    <div class="nav"><button class="btn sm" data-nav="-1" aria-label="Back">‹</button><span class="range">${rangeText}</span><button class="btn sm" data-nav="1" aria-label="Forward">›</button><button class="btn sm" data-nav="0">Today</button></div>
    <span class="sync">Synced ${gen}</span></div></header><div class="wrap">`;
  if(view==="topics"){
    const t=S.topics||{counts:{winner:{},new:{}},review:[]}, cw=t.counts.winner||{}, cn=t.counts.new||{};
    html += `<h2 class="day">Topic pool</h2><div class="stats" style="margin-bottom:6px">
      <div class="stat"><b>${cw.free??"–"} / ${cw.active??"–"}</b>Winners free this week</div>
      <div class="stat"><b>${cn.free??"–"} / ${cn.active??"–"}</b>New topics free this week</div></div>
      <p class="hint">Rules: every day is half winners, half new topics. A topic can't repeat within ${t.cooldown_days||7} days. You need about 21 of each to fill a full week without repeats.</p>
      <h2 class="day">New topics to review (${t.review.length})</h2>`;
    if(!t.review.length) html += `<div class="empty-day">Nothing to review right now.</div>`;
    html += t.review.map(it=>`<article class="card" style="grid-template-columns:1fr"><div class="info">
      <div class="row"><span class="tag">${esc(it.category||"")}</span><span class="hint">${esc(it.id)}</span></div>
      <div class="title">${esc(it.hook)}</div>
      ${(it.beats||[]).length?`<ol class="beats">${it.beats.map(b=>`<li>${esc(b)}</li>`).join("")}</ol>`:""}
      ${it.caption?`<div class="hint">Caption: ${esc(it.caption)}</div>`:""}
      <div class="actions"><button class="btn ok" data-topic="topic_keep" data-item="${esc(it.id)}">✅ Keep</button><button class="btn bad" data-topic="topic_toss" data-item="${esc(it.id)}">🗑 Toss</button></div>
    </div></article>`).join("");
  } else if(view==="clips"){
html += clipsView();
} else if(view==="week"){
    html += `<div class="week">` + days.map(d=>{
      const times = slotTimes(d,g);
      return `<div class="col ${d===todayKey()?"today":""}"><h3 data-goto="${d}">${fmtDay(d)} <span>open ›</span></h3>` + times.map(t=>{
        const list = (g[d]||{})[t]||[]; const e=list[0];
        if(!e) return `<div class="chip empty"><b>${fmtTime(t)}</b>${schedType(t)==="trial"?"trial":"regular"} · nothing yet</div>`;
        const st=statusOf(e);
        return `<button class="chip ${st.cls}" data-goto="${d}" data-slot="${t}"><b>${fmtTime(t)} · ${e.post_type==="trial"?"Trial":"Regular"}</b>${esc(short(e.title||e.item_id))}<br>${st.text}${list.length>1?` · ${list.length} versions`:""}</button>`;
      }).join("") + `</div>`; }).join("") + `</div><p class="hint">Tap a reel or a day to open the detailed view.</p>`;
  } else {
    for(const d of days){
      html += `<h2 class="day">${d===todayKey()?"Today · ":(d===addDays(todayKey(),1)?"Tomorrow · ":"")}${fmtDay(d,true)}</h2>`;
      const times = slotTimes(d,g);
      if(!times.length) html += `<div class="empty-day">No reels on this day yet.</div>`;
      for(const t of times){
        const list=(g[d]||{})[t]||[];
        html += `<section class="slot" id="slot-${d}-${t.replace(":","")}"><div class="slot-h"><span class="t">${fmtTime(t)}</span><span class="tag ${(list[0]?.post_type||schedType(t))==="trial"?"trial":""}">${(list[0]?.post_type||schedType(t))==="trial"?"Trial reel":"Regular reel"}</span></div>`;
        if(!list.length){ html += `<div class="empty-day">Nothing made for this slot yet. The evening job (around 7:15 PM) keeps the next few days filled.</div>`; }
        const cur = list.filter(e=>rank(e)<3), old = list.filter(e=>rank(e)>=3);
        html += cur.map(card).join("");
        if(old.length) html += `<details style="margin-top:8px"><summary>Earlier versions (${old.length})</summary>${old.map(e=>card(e,true)).join("")}</details>`;
        html += `</section>`;
      }
    }
  }
  html += `</div>`;
  const y = window.scrollY; const ta = {}; document.querySelectorAll("textarea[data-note]").forEach(x=>ta[x.dataset.note]=x.value);
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll("textarea[data-note]").forEach(x=>{ if(ta[x.dataset.note]) x.value=ta[x.dataset.note]; });
  window.scrollTo(0,y);
if(view==="clips" && CE) bindClipEditor();
}
function short(s){ s=String(s); return s.length>70? s.slice(0,68)+"…" : s; }

function moveOptions(e){
  const opts=[]; const now=Date.now();
  for(let i=0;i<4;i++){ const d=addDays(todayKey(),i); for(const s of (S.schedule||[])){
    const iso = isoFor(d,s.time); if(Date.parse(iso)<=now+10*60000 || iso===e.slot_iso) continue;
    opts.push(`<option value="${iso}">${fmtDay(d)} ${fmtTime(s.time)} (${s.type})</option>`); } }
  return opts.join("");
}
function isoFor(dayK, t){ // local (tz) day+time -> ISO UTC
  const [y,m,d]=dayK.split("-").map(Number), [h,mi]=t.split(":").map(Number);
  let guess = Date.UTC(y,m-1,d,h,mi);
  for(let k=0;k<2;k++){ const o=parts(new Date(guess).toISOString()); const asUTC=Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute); guess += Date.UTC(y,m-1,d,h,mi)-asUTC; }
  return new Date(guess).toISOString();
}

function card(e, old){
  const st=statusOf(e), live = !old && e.status!=="posted" && !e.replaced_by && e.status!=="missed" && e.status!=="expired";
  const notesClip = (S.clip_notes||{})[e.clip_id]||[];
  const stats = e.stats ? `<div class="stats">${[["views","Views"],["likes","Likes"],["shares","Shares"],["saved","Saves"],["comments","Comments"],["link_clicks","Link clicks"]].filter(([k])=>e.stats[k]!=null).map(([k,l])=>`<div class="stat"><b>${fmtNum(e.stats[k])}</b>${l}</div>`).join("")}</div>` : "";
  const vid = e.file_id ? `<video controls playsinline preload="metadata" src="/api/video/${e.id}"></video>` : `<div class="novid">No preview here — this one was made before the dashboard. It's in your Telegram chat.</div>`;
  return `<article class="card ${old?"old":""}">
    <div class="vid ${e.file_id?"":"none"}">${vid}</div>
    <div class="info">
      <div class="row"><span class="pill ${st.cls}">${st.text}</span>${e.pending_sync?`<span class="hint">saving…</span>`:""}${e.post_now?`<span class="tag">🚀 posting now</span>`:""}${e.replaces?`<span class="tag">🔁 replacement</span>`:""}${e.extra?`<span class="tag">extra</span>`:""}</div>
      ${ED[e.id]?`
      <div class="editor">
        <div class="hint">Title (the big first line)</div>
        <input data-edhook="${e.id}" value="${esc(ED[e.id].hook)}" maxlength="200" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)">
        <div class="hint" style="margin-top:6px">Fact lines — one per line, in the order they pop up (blank line = remove)</div>
        <textarea data-edbeats="${e.id}" style="min-height:${Math.max(62, 24*ED[e.id].beats.length+28)}px">${esc(ED[e.id].beats.join("\n"))}</textarea>
        <div class="actions" style="margin-top:6px">
          <button class="btn primary" data-act="text_edit" data-id="${e.id}">Save text + new version</button>
          <button class="btn sm" data-edcancel="${e.id}">Cancel</button>
          <span class="hint" style="align-self:center">The new wording is kept for this topic from now on.</span>
        </div>
      </div>`:`
      <div class="title">${esc(e.title||e.item_id)}${e.text_edited?` <span class="tag" title="your wording">✏️</span>`:""}</div>
      ${(e.beats||[]).length?`<ol class="beats">${e.beats.map(b=>`<li>${esc(b)}</li>`).join("")}</ol>`:""}`}
      <dl class="meta">
        <dt>Clip</dt><dd>${esc(e.clip_id)}</dd>
        <dt>Music</dt><dd>${e.music?`🎵 ${esc(e.music.title)} — ${esc(e.music.creator)}${e.music.genre?` <span class="muted">(${esc(e.music.genre)})</span>`:""}`:`<span class="muted">picked at post time</span>`}</dd>
        <dt>Type</dt><dd>${e.post_type==="trial"?"Trial (shown to non-followers first)":"Regular"}${e.mode?` <span class="muted">· ${esc(e.mode)}</span>`:""}</dd>
        <dt>Topic</dt><dd><span class="muted">${esc(e.item_id)}</span></dd>
        ${e.permalink?`<dt>Post</dt><dd><a href="${esc(e.permalink)}" target="_blank" rel="noopener">Open on Instagram ↗</a></dd>`:""}
      </dl>
      ${stats}
      ${(e.feedback||[]).length?`<div><div class="hint">Your notes on this reel</div><ul class="notes">${e.feedback.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:""}
      ${notesClip.length?`<details><summary>Notes on ${esc(e.clip_id)} from other reels (${notesClip.length})</summary><ul class="notes">${notesClip.slice().reverse().map(n=>`<li>${esc(n.text)}<small>${esc(n.item_id||"")} · ${n.at?new Date(n.at).toLocaleDateString():""}</small></li>`).join("")}</ul></details>`:""}
      ${live?`
      <div class="actions">
        <button class="btn ok" data-act="approve" data-id="${e.id}" ${e.status==="approved"?"disabled":""}>✅ Approve</button>
        <button class="btn bad" data-act="skip" data-id="${e.id}" ${e.status==="skipped"?"disabled":""}>❌ Skip</button>
        <button class="btn" data-act="post_now" data-id="${e.id}" ${e.status!=="approved"?"disabled title='Approve it first'":""}>🚀 Post now</button>
      </div>
      <div><textarea data-note="${e.id}" placeholder="Notes (text placement, timing…). Sending notes skips this reel and makes a new version with the SAME topic + clip. For box placement/timing, set the clip on the Clips tab first — the new version uses it."></textarea>
        <div class="actions" style="margin-top:6px"><button class="btn primary" data-act="note" data-id="${e.id}">Send notes + new version</button></div></div>
      <div class="actions"><span class="hint" style="align-self:center">Redo:</span>
        <button class="btn sm" data-edit="${e.id}" ${ED[e.id]?"disabled":""}>✏️ Edit text</button>
        <button class="btn sm" data-act="swap_music" data-id="${e.id}">🎵 New music</button>
        <button class="btn sm" data-act="new_clip" data-id="${e.id}">🎬 Same topic, new clip</button>
        <button class="btn sm" data-act="new_topic" data-id="${e.id}">💡 Same clip, new topic</button></div>
<div class="actions"><span class="hint" style="align-self:center">Type:</span>
<button class="btn sm" data-act="swap_type" data-id="${e.id}">🔄 ${e.post_type==="trial"?"Make it a regular reel":"Make it a trial reel"}</button></div>
      <div class="actions"><span class="hint" style="align-self:center">Move to:</span>
        <select data-move="${e.id}"><option value="">Pick a time…</option>${moveOptions(e)}<option value="custom">Custom time…</option></select>
        <input type="datetime-local" data-custom="${e.id}" hidden>
        <button class="btn sm" data-act="move" data-id="${e.id}">Move</button></div>
      <div class="hint">Every change (notes, redo, move, type) needs your approval again. Telegram stays in sync with what you do here.</div>`:""}
    </div></article>`;
}

// ───────── Clips tab: Nick's permanent settings per clip (box times + spots, title height, trim) ─────────
let CE = null; // open clip editor (draft): {id, events|null, auto, title_y, start, end, placing, dirty, t}
function clipsView(){
  const clips = (S.clips||[]).slice().sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  const prev = new Set(S.clip_previews||[]);
  if(CE){ const c = clips.find(x=>x.id===CE.id); if(c) return clipEditor(c, prev.has(c.id)); CE=null; }
  const set = clips.filter(c=>c.events_manual!=null||c.title_y!=null||c.end!=null).length;
  let h = `<h2 class="day">Clips (${clips.length})</h2><p class="hint">Tap a clip to set when and where the fact boxes pop up, the title height and where the reel should end. Settings are saved for good and used every time that clip is picked. ${set} of ${clips.length} have your settings.</p><div class="clips">`;
  h += clips.map(c=>{ const tags=[]; const ev=c.events_manual;
    if(ev!=null) tags.push(ev.length?`📍 ${ev.length} pop-up${ev.length>1?"s":""}`:"📍 no pointing");
    if(c.end!=null) tags.push(`✂️ ends ${(+c.end).toFixed(1)}s`); if(c.title_y!=null) tags.push(`↕ title ${Math.round(c.title_y*100)}%`);
    const notes=((S.clip_notes||{})[c.id]||[]).length;
    return `<button class="clipcard ${c.status!=="active"?"dim":""}" data-clip="${esc(c.id)}"><b>${esc(c.id)}${c.pending_sync?' <span class="hint">saving…</span>':""}</b><span class="hint">${c.duration?(+c.duration).toFixed(1)+"s · ":""}${c.uses} use${c.uses===1?"":"s"}${c.last_used?" · last "+new Date(c.last_used).toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}${c.status!=="active"?" · "+esc(c.status):""}</span><span class="tags">${tags.length?tags.map(t=>`<span class="tag">${t}</span>`).join(""):`<span class="tag auto">bot decides${(c.auto_events||[]).length?" · "+c.auto_events.length+" detected":""}</span>`}${notes?`<span class="tag">📝 ${notes}</span>`:""}${prev.has(c.id)?"":`<span class="tag">no preview yet</span>`}</span></button>`; }).join("");
  return h + `</div>`;
}
function openClip(c){ CE = {id:c.id, events: c.events_manual==null? null : c.events_manual.map(e=>({...e})), auto: c.auto_events||[], title_y: c.title_y??null, start: c.start||0, end: c.end??null, placing:null, dirty:false, t:0}; }
function dirFor(y){ return y<0.42? "up" : y>0.68? "down" : "center"; }
function clipEditor(c, hasPrev){
  const ev = CE.events, dur = +(c.duration||0);
  const notes = ((S.clip_notes||{})[c.id]||[]).slice().reverse();
  const marks = (ev||[]).map((e,i)=>`<div class="mark" style="left:${(e.x*100).toFixed(1)}%;top:${(e.y*100).toFixed(1)}%">${i+1}</div>`).join("");
  const tline = `<div class="tline" id="cetline" style="top:${((CE.title_y??0.5)*100).toFixed(1)}%"><span>title</span></div>`;
  const vid = hasPrev ? `<video id="cv" playsinline preload="auto" src="/api/clip/${esc(c.id)}.mp4"></video>` : `<div class="novid">No preview of this clip yet — the evening job makes one (or run the queue job once). You can still type the times.</div>`;
  const evRows = ev===null ? `<div class="hint">Bot decides: it uses the pointing it detected${CE.auto.length?` (${CE.auto.map(e=>`${(+e.t).toFixed(1)}s ${e.dir}`).join(", ")})`:" — none found, so boxes spread out and the last one lands ~1.5 s before the end"}.</div>`
    : (ev.length ? `<ol class="evlist">${ev.map((e,i)=>`<li><b>${i+1}</b> pops at <input type="number" step="0.1" min="0" value="${(+e.t).toFixed(1)}" data-evt="${i}" style="width:64px">s · box ${e.dir} <button class="btn sm" data-cact="ev_go" data-i="${i}">▶ go</button> <button class="btn sm" data-cact="ev_place" data-i="${i}">📍 move box</button> <button class="btn sm bad" data-cact="ev_del" data-i="${i}">✕</button></li>`).join("")}</ol>` : `<div class="hint">No pointing in this clip: the boxes spread out on their own and the last one lands ~1.5 s before the end.</div>`);
  return `<div class="row" style="margin:14px 0 8px"><button class="btn" data-cact="back">‹ All clips</button><span class="title">${esc(c.id)}</span><span class="hint">${dur?dur.toFixed(1)+"s · ":""}${c.uses} use${c.uses===1?"":"s"}</span></div>
<article class="card ce"><div><div class="vid cevid">${vid}${hasPrev?`<div class="overlay" id="ceov">${marks}${tline}</div>`:""}</div>
${hasPrev?`<div class="row" style="margin-top:8px;justify-content:center"><button class="btn sm" data-cact="play">▶ / ❚❚</button><button class="btn sm" data-cact="back_s">−0.5s</button><button class="btn sm" data-cact="fwd_s">+0.5s</button><span class="hint" id="cetime">${CE.t.toFixed(1)}s</span></div>
<input type="range" id="cescrub" min="0" max="${dur||10}" step="0.05" value="${CE.t}" style="width:100%;margin-top:6px">`:""}
</div><div class="info">
${CE.placing!=null?`<div class="placing">👆 Tap on the video where box ${CE.placing+1} should sit (next to where she points).</div>`:""}
<div><div class="hint">Fact boxes</div>${evRows}
<div class="actions" style="margin-top:6px"><button class="btn primary sm" data-cact="ev_add">📍 A box pops up here</button>${ev===null?`<button class="btn sm" data-cact="ev_none">No pointing in this clip</button>`:`<button class="btn sm" data-cact="ev_auto">Let the bot decide</button>`}</div>
<div class="hint">Scrub to the moment she points, press "A box pops up here", then tap where the box should sit. Facts get grouped to fit the number of boxes.</div></div>
<div><div class="hint">Title height: ${Math.round((CE.title_y??0.5)*100)}% down the frame${CE.title_y==null?" (default — it moves off her face on its own)":""}</div>
<div class="row"><input type="range" id="cetitle" min="0.15" max="0.85" step="0.01" value="${CE.title_y??0.5}" style="flex:1;min-width:140px"> <button class="btn sm" data-cact="title_clear">Use default</button></div></div>
<div><div class="hint">Trim</div><div class="row">Start <input type="number" step="0.1" min="0" id="cestart" value="${(+CE.start).toFixed(1)}" style="width:64px">s · End ${CE.end!=null?`<b>${(+CE.end).toFixed(1)}s</b>${dur?` <span class="hint">(cuts ${Math.max(0,dur-CE.end).toFixed(1)}s off the end)</span>`:""}`:`<span class="muted">full clip</span>`}
<button class="btn sm" data-cact="end_here">✂️ End the reel here</button>${CE.end!=null?`<button class="btn sm" data-cact="end_clear">Full clip</button>`:""}</div></div>
${notes.length?`<details open><summary>Your notes on this clip (${notes.length})</summary><ul class="notes">${notes.map(n=>`<li>${esc(n.text)}<small>${esc(n.item_id||"")} · ${n.at?new Date(n.at).toLocaleDateString():""}</small></li>`).join("")}</ul></details>`:""}
<div class="actions"><button class="btn ok" data-cact="save" ${CE.dirty?"":"disabled"}>💾 Save clip settings</button><button class="btn" data-cact="back">${CE.dirty?"Cancel":"Back"}</button></div>
<div class="hint">Saved settings apply to every future reel on this clip. Reels already in the queue pick them up when they're re-rendered or posted.</div>
</div></article>`;
}
function cvid(){ return document.getElementById("cv"); }
function bindClipEditor(){
  const v = cvid(); if(!v) return;
  const scrub = document.getElementById("cescrub"), tm = document.getElementById("cetime");
  const seek = t => { CE.t = Math.max(0, t); try{ v.currentTime = CE.t; }catch(e){} };
  if(CE.t>0){ if(v.readyState>=1) v.currentTime = CE.t; else v.addEventListener("loadedmetadata", ()=>{ v.currentTime = CE.t; }, {once:true}); }
  v.addEventListener("timeupdate", ()=>{ CE.t = v.currentTime; if(tm) tm.textContent = v.currentTime.toFixed(1)+"s"; if(scrub && document.activeElement!==scrub) scrub.value = v.currentTime; });
  if(scrub) scrub.oninput = ()=> seek(+scrub.value);
  const ts = document.getElementById("cetitle"); if(ts) ts.oninput = ()=>{ CE.title_y = +ts.value; CE.dirty = true; const l=document.getElementById("cetline"); if(l) l.style.top = (CE.title_y*100).toFixed(1)+"%"; const sv=document.querySelector('[data-cact="save"]'); if(sv) sv.disabled=false; };
  const ov = document.getElementById("ceov"); if(ov) ov.onclick = ev => { if(CE.placing==null){ if(v.paused) v.play(); else v.pause(); return; }
    const r = ov.getBoundingClientRect(); const x = Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)), y = Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));
    const e = CE.events[CE.placing]; if(e){ e.x=+x.toFixed(3); e.y=+y.toFixed(3); e.dir=dirFor(y); } CE.placing=null; CE.dirty=true; render(); };
}
document.addEventListener("change", ev=>{ const i=ev.target.closest("input[data-evt]"); if(i && CE && CE.events){ const e=CE.events[+i.dataset.evt]; if(e){ e.t=Math.max(0,+i.value||0); CE.events.sort((a,b)=>a.t-b.t); CE.dirty=true; render(); } return; }
  const s=ev.target.closest("#cestart"); if(s && CE){ CE.start=Math.max(0,+s.value||0); CE.dirty=true; render(); } });
async function clipAct(kind, b){
  const v = cvid(), c = (S.clips||[]).find(x=>x.id===CE.id) || {};
  const now = () => +( (v? v.currentTime : CE.t) || 0 ).toFixed(1);
  if(kind==="back"){ if(CE.dirty && !confirm("Leave without saving your changes?")) return; CE=null; render(); return; }
  if(kind==="play"){ if(v){ if(v.paused) v.play(); else v.pause(); } return; }
  if(kind==="back_s"||kind==="fwd_s"){ if(v){ v.currentTime = Math.max(0, v.currentTime + (kind==="fwd_s"?0.5:-0.5)); } return; }
  if(kind==="ev_go"){ const e=CE.events[+b.dataset.i]; if(v && e){ v.pause(); v.currentTime=e.t; } return; }
  if(kind==="ev_place"){ CE.placing=+b.dataset.i; if(v) v.pause(); render(); return; }
  if(kind==="ev_del"){ CE.events.splice(+b.dataset.i,1); CE.placing=null; CE.dirty=true; render(); return; }
  if(kind==="ev_add"){ if(v) v.pause(); if(CE.events===null) CE.events=[]; if(CE.events.length>=6) return toast("6 boxes is the most a reel can hold.");
    const e={t:now(), dir:"center", x:0.5, y:0.6}; CE.events.push(e); CE.events.sort((a,b)=>a.t-b.t); CE.placing=CE.events.indexOf(e); CE.dirty=true; render(); return; }
  if(kind==="ev_none"){ CE.events=[]; CE.placing=null; CE.dirty=true; render(); return; }
  if(kind==="ev_auto"){ CE.events=null; CE.placing=null; CE.dirty=true; render(); return; }
  if(kind==="title_clear"){ CE.title_y=null; CE.dirty=true; render(); return; }
  if(kind==="end_here"){ let t = v? now() : +prompt("End the reel at how many seconds?", c.duration? (c.duration-0.7).toFixed(1) : "6.0"); if(!(t>0.5)) return toast("Scrub to where the reel should end first."); CE.end=t; CE.dirty=true; render(); return; }
  if(kind==="end_clear"){ CE.end=null; CE.dirty=true; render(); return; }
  if(kind==="save"){ if(busy) return; busy=true; b.disabled=true;
    try{ await api("/api/action",{method:"POST",body:JSON.stringify({kind:"clip_edit", clip_id:CE.id, events:CE.events, title_y:CE.title_y, start:CE.start, end:CE.end})});
      toast("Saved ✅ — every new reel on "+CE.id+" uses this."); CE=null; await load(true); }
    catch(e){ if(e.message!=="login") toast("Didn't work: "+e.message); } finally{ busy=false; } return; }
}

document.addEventListener("click", async ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.clip){ const c=(S.clips||[]).find(x=>x.id===b.dataset.clip); if(c){ openClip(c); render(); } return; }
  if(b.dataset.cact){ if(!CE) return; await clipAct(b.dataset.cact, b); return; }
  if(b.dataset.view){ view=b.dataset.view; localStore("view",view); render(); return; }
  if(b.dataset.nav!==undefined){ const n=+b.dataset.nav; anchor = n===0? todayKey() : addDays(anchor, n*(view==="week"?7:1)); render(); return; }
  if(b.dataset.goto){ anchor=b.dataset.goto; view="day"; localStore("view",view); render(); const s=b.dataset.slot; if(s){ const el=document.getElementById(`slot-${anchor}-${s.replace(":","")}`); el && el.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  if(b.dataset.topic){ if(busy) return; busy=true; b.disabled=true;
    try{ await api("/api/action",{method:"POST",body:JSON.stringify({kind:b.dataset.topic,item_id:b.dataset.item})}); toast(b.dataset.topic==="topic_keep"?"Kept ✅ — it can be picked from now on":"Tossed"); await load(true); }
    catch(e){ if(e.message!=="login") toast("Didn't work: "+e.message); } finally{ busy=false; } return; }
  if(b.dataset.edit){ const e=(S.entries||[]).find(x=>x.id===b.dataset.edit); if(!e) return; ED[e.id]={hook:e.title||"", beats:(e.beats||[]).slice()}; render();
    const inp=document.querySelector(`input[data-edhook="${e.id}"]`); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
  if(b.dataset.edcancel){ delete ED[b.dataset.edcancel]; render(); return; }
  if(b.dataset.act){ const kind=b.dataset.act, id=b.dataset.id; const body={entry_id:id, kind};
    if(kind==="text_edit"){ const d=ED[id]; if(!d) return; body.hook=d.hook.trim(); body.beats=d.beats.map(x=>x.trim()).filter(Boolean);
      if(!body.hook) return toast("The title can't be empty.");
      const e=(S.entries||[]).find(x=>x.id===id); if(e && body.hook===(e.title||"") && JSON.stringify(body.beats)===JSON.stringify(e.beats||[])) return toast("Nothing changed yet."); }
    if(kind==="note"){ const ta=document.querySelector(`textarea[data-note="${id}"]`); body.text=(ta&&ta.value||"").trim(); if(!body.text) return toast("Type your notes first."); }
    if(kind==="move"){ const sel=document.querySelector(`select[data-move="${id}"]`); let v=sel.value;
      if(v==="custom"){ const inp=document.querySelector(`input[data-custom="${id}"]`); if(!inp.value) return toast("Pick the custom time."); const [dd,tt]=inp.value.split("T"); v=isoFor(dd,tt.slice(0,5)); }
      if(!v) return toast("Pick a time to move it to."); body.slot_iso=v; }
    if(kind==="post_now" && !confirm("Post this reel to Instagram right now?")) return;
    if(REDO[kind] && !confirm(`Make a new version with ${REDO[kind]}? This one will be skipped.`)) return;
    if(busy) return; busy=true; b.disabled=true;
    try{ const r=await api("/api/action",{method:"POST",body:JSON.stringify(body)});
      const msg={approve:"Approved ✅", skip:"Skipped", note:"Notes sent — new version (same topic + clip) coming (~10 min)", post_now:"Posting now 🚀 (a few minutes)", move:"Moved — approve it again when ready", swap_type:"Type switched — approve it again when ready", text_edit:"Text saved ✏️ — same reel with the new words coming (~10 min)"}[kind] || "New version coming (~10 min)";
      toast(msg + (r.job==="queued"?" · will start within 5 min":""));
      if(kind==="note"){ const ta=document.querySelector(`textarea[data-note="${id}"]`); if(ta) ta.value=""; }
      if(kind==="text_edit") delete ED[id];
      await load(true);
    }catch(e){ if(e.message!=="login") toast("Didn't work: "+e.message); }
    finally{ busy=false; b.disabled=false; }
  }
});
document.addEventListener("input", ev=>{ const t=ev.target; // keep the text-editor draft across re-renders
  if(t.dataset.edhook && ED[t.dataset.edhook]) ED[t.dataset.edhook].hook=t.value;
  if(t.dataset.edbeats && ED[t.dataset.edbeats]) ED[t.dataset.edbeats].beats=t.value.split("\n"); });
document.addEventListener("change", ev=>{ const s=ev.target.closest("select[data-move]"); if(s){ const inp=document.querySelector(`input[data-custom="${s.dataset.move}"]`); inp.hidden = s.value!=="custom"; } });
setInterval(()=>{ const playing=[...document.querySelectorAll("video")].some(v=>!v.paused); if(S && !document.hidden && !playing && !CE && !document.activeElement?.matches("textarea,select,input")) load(true); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && S) load(true); });
load();
</script>
</body>
